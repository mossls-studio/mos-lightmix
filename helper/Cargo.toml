[package]
name = "effectcraft-helper-mos-lightmix"
version = "1.3.2"
edition = "2021"

[[bin]]
name = "effectcraft-helper-mos-lightmix"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
itoa = "=1.0.18"
memchr = "=2.8.3"
zmij = "=1.0.23"

[profile.release]
opt-level = 3
panic = "abort"
